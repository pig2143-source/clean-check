<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#138a4b"><title>潔淨打卡 Demo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#eef5f0;color:#173126}.app{max-width:520px;min-height:100vh;margin:auto;background:#f8fbf9;padding-bottom:82px}.hide{display:none!important}.login{min-height:100vh;padding:60px 24px;background:radial-gradient(circle at top,#d7f3e1,#f8fbf9 58%)}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 28px #174a2c14}.logo{width:76px;height:76px;border-radius:24px;background:#138a4b;color:#fff;display:grid;place-items:center;margin:auto;font-size:38px}h1{text-align:center;margin:14px 0 4px}.muted{font-size:13px;color:#718278}.center{text-align:center}.label{display:block;font-size:13px;font-weight:800;color:#526b5c;margin:15px 0 7px}.input{width:100%;border:1px solid #d8e5dc;border-radius:13px;padding:13px;font-size:16px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.roles button,.pill{border:1px solid #d7e5dc;background:#fff;border-radius:12px;padding:12px;font-weight:800}.roles .on{background:#e0f4e7;color:#08733a;border-color:#138a4b}.btn{border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:800}.primary{background:#138a4b;color:#fff}.danger{background:#d93c3c;color:#fff}.full{width:100%}.header{padding:22px 20px 18px;color:#fff;background:linear-gradient(135deg,#0f7d43,#20a55f);border-radius:0 0 28px 28px}.row{display:flex;align-items:center;gap:12px}.space{justify-content:space-between}.content{padding:18px}.progress{height:10px;background:#e8eee9;border-radius:10px;overflow:hidden}.bar{height:100%;background:#18a257}.task{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #edf2ee}.task:last-child{border-bottom:0}.icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#e8f6ed}.badge{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px}.done{background:#e4f7eb;color:#137741}.pending{background:#fff3dc;color:#a46000}.redo{background:#ffe7e7;color:#bd2828}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #e1ebe4;padding:8px}.nav button{border:0;background:none;padding:8px;font-weight:800;color:#668071}.nav .on{color:#138a4b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{text-align:center;padding:15px;background:#f3f8f5;border-radius:15px}.stat b{font-size:25px;display:block}.upload{display:block;border:2px dashed #b7d4c1;border-radius:18px;padding:20px;text-align:center;background:#f3faf5}.photo{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.back{border:0;background:#ffffff2e;color:#fff;border-radius:10px;padding:8px 11px}@media(min-width:700px){body{padding:24px}.app{border-radius:28px;overflow:hidden;box-shadow:0 20px 60px #174a2c26}}
</style></head><body><div class="app">
<section id="login" class="login"><div class="card"><div class="logo">🧹</div><h1>潔淨打卡</h1><p class="muted center">每日清潔管理 App</p><span class="label">登入身分</span><div class="roles"><button id="staffRole" class="on" onclick="setRole('staff')">員工</button><button id="managerRole" onclick="setRole('manager')">主管</button></div><span class="label">姓名</span><input id="name" class="input" placeholder="例如：小明"><span class="label">密碼</span><input class="input" type="password" value="1234"><br><br><button class="btn primary full" onclick="login()">登入</button><p class="muted center">展示版可直接使用密碼 1234</p></div></section>
<section id="main" class="hide"><header class="header"><div class="row space"><div><div style="font-size:13px;opacity:.85">單店清潔管理</div><h2 id="hello" style="margin:4px 0"></h2><div id="mode" style="font-size:13px"></div></div><button class="back" onclick="logout()">登出</button></div></header><main id="content" class="content"></main><nav class="nav"><button id="nHome" class="on" onclick="show('home')">🏠<br>首頁</button><button id="nHistory" onclick="show('history')">🕘<br>紀錄</button><button id="nSettings" onclick="show('settings')">⚙️<br>設定</button></nav></section>
<section id="taskPage" class="hide"><header class="header"><div class="row"><button class="back" onclick="closeTask()">返回</button><div><div style="font-size:13px;opacity:.8">清潔項目</div><h2 id="taskTitle" style="margin:0"></h2></div></div></header><main class="content"><div class="card"><b>清潔標準</b><p class="muted">完成表面、邊角與周邊區域清潔，照片需清楚呈現結果。</p><span class="label">清潔照片 *</span><label class="upload"><div id="photoHint">📷<br><b>點擊拍照或選擇照片</b><br><span class="muted">手機會優先開啟相機</span></div><img id="preview" class="photo hide"><input id="camera" hidden type="file" accept="image/*" capture="environment" onchange="previewPhoto(event)"></label><span class="label">備註</span><textarea id="note" class="input" style="min-height:90px" placeholder="清潔狀況或異常事項"></textarea><br><br><button class="btn primary full" onclick="submitTask()">完成並送出審核</button></div></main></section>
</div><script>
let role='staff',user='',selected=null,photo='';let tasks=JSON.parse(localStorage.getItem('cc_tasks')||'null')||[
{id:1,name:'鐵板清潔',area:'廚房',time:'打烊後',status:'done',staff:'小明'},{id:2,name:'地板拖洗',area:'用餐區',time:'打烊後',status:'done',staff:'小華'},{id:3,name:'冰箱整理',area:'廚房',time:'每日',status:'pending',staff:''},{id:4,name:'廁所清潔',area:'廁所',time:'每日三次',status:'pending',staff:''},{id:5,name:'排水溝清潔',area:'廚房',time:'打烊後',status:'redo',staff:'小明'},{id:6,name:'垃圾桶清潔',area:'全店',time:'打烊後',status:'pending',staff:''}];let history=JSON.parse(localStorage.getItem('cc_history')||'[]');
function save(){localStorage.setItem('cc_tasks',JSON.stringify(tasks));localStorage.setItem('cc_history',JSON.stringify(history))}function setRole(r){role=r;staffRole.classList.toggle('on',r==='staff');managerRole.classList.toggle('on',r==='manager')}function login(){user=name.value|| (role==='staff'?'小明':'店長');login.classList.add('hide');main.classList.remove('hide');hello.textContent='午安，'+user;mode.textContent=(role==='staff'?'員工模式':'主管模式')+' · '+new Date().toLocaleDateString('zh-TW');show('home')}function logout(){main.classList.add('hide');login.classList.remove('hide')}function badge(s){let m={done:['已完成','done'],approved:['合格','done'],review:['待審核','pending'],pending:['待完成','pending'],redo:['需重做','redo']}[s];return `<span class="badge ${m[1]}">${m[0]}</span>`}function show(p){['nHome','nHistory','nSettings'].forEach(x=>document.getElementById(x).classList.remove('on'));document.getElementById('n'+p[0].toUpperCase()+p.slice(1)).classList.add('on');if(p==='home')renderHome();if(p==='history')renderHistory();if(p==='settings')renderSettings()}
function renderHome(){if(role==='staff'){let d=tasks.filter(x=>['done','approved'].includes(x.status)).length;content.innerHTML=`<div class="card"><div class="row space"><div><div class="muted">今日清潔進度</div><h2 style="margin:4px 0">${d} / ${tasks.length} 項</h2></div><b>✨</b></div><div class="progress"><div class="bar" style="width:${d/tasks.length*100}%"></div></div></div><h3>今日任務</h3><div class="card">${tasks.map(t=>`<div class="task" onclick="openTask(${t.id})"><div class="icon">🧽</div><div style="flex:1"><b>${t.name}</b><div class="muted">${t.area} · ${t.time}</div></div>${badge(t.status)}</div>`).join('')}</div>`}else{let a=tasks.filter(x=>['done','approved'].includes(x.status)).length,r=tasks.filter(x=>x.status==='review').length,p=tasks.length-a-r;content.innerHTML=`<div class="grid"><div class="stat"><span class="muted">已完成</span><b>${a}</b></div><div class="stat"><span class="muted">待審核</span><b>${r}</b></div></div><h3>待審核與異常</h3><div class="card">${tasks.filter(x=>['review','redo'].includes(x.status)).map(t=>`<div class="task" style="display:block"><div class="row space"><div><b>${t.name}</b><div class="muted">${t.staff||'未指派'} · ${t.area}</div></div>${badge(t.status)}</div>${t.photo?`<img class="photo" src="${t.photo}" style="margin-top:10px">`:''}<div class="actions"><button class="btn primary" onclick="review(${t.id},'approved')">✓ 合格</button><button class="btn danger" onclick="review(${t.id},'redo')">↻ 重做</button></div></div>`).join('')||'<p class="muted">目前沒有待審核項目。</p>'}</div><h3>全部項目</h3><div class="card">${tasks.map(t=>`<div class="task"><div style="flex:1"><b>${t.name}</b><div class="muted">${t.staff||'未完成'}</div></div>${badge(t.status)}</div>`).join('')}</div>`}}
function openTask(id){selected=tasks.find(x=>x.id===id);main.classList.add('hide');taskPage.classList.remove('hide');taskTitle.textContent=selected.name;note.value='';photo='';preview.classList.add('hide');photoHint.classList.remove('hide')}function closeTask(){taskPage.classList.add('hide');main.classList.remove('hide')}function previewPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{photo=r.result;preview.src=photo;preview.classList.remove('hide');photoHint.classList.add('hide')};r.readAsDataURL(f)}function submitTask(){if(!photo){alert('請先拍照或上傳照片');return}tasks=tasks.map(t=>t.id===selected.id?{...t,status:'review',staff:user,photo,note:note.value}:t);history.unshift({...selected,status:'review',staff:user,photo,note:note.value,date:new Date().toLocaleString('zh-TW')});save();closeTask();renderHome()}function review(id,status){tasks=tasks.map(t=>t.id===id?{...t,status}:t);save();renderHome()}function renderHistory(){let rows=history.length?history:tasks.filter(x=>x.staff).map(x=>({...x,date:'今日'}));content.innerHTML=`<h2>歷史紀錄</h2><div class="card">${rows.map(r=>`<div class="task">${r.photo?`<img src="${r.photo}" style="width:54px;height:54px;object-fit:cover;border-radius:12px">`:'<div class="icon">🕘</div>'}<div style="flex:1"><b>${r.name}</b><div class="muted">${r.staff} · ${r.date}</div></div>${badge(r.status)}</div>`).join('')}</div>`}function renderSettings(){content.innerHTML=`<h2>設定</h2><div class="card"><div class="task"><div class="icon">🏪</div><div><b>門市資料</b><div class="muted">單店模式</div></div></div><div class="task"><div class="icon">👤</div><div><b>目前帳號</b><div class="muted">${user} · ${role==='staff'?'員工':'主管'}</div></div></div><div class="task"><div class="icon">⚙️</div><div><b>清潔項目管理</b><div class="muted">正式版可新增與調整任務</div></div></div></div>`}
</script></body></html>
